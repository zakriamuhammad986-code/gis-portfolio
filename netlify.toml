# Netlify settings. Nothing secret belongs in this file: it is public.
# There is no build step: the site is plain files, published as they are.
[build]
  publish = "."

# Security headers for every page.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

# The admin page needs to load the CMS script and talk to GitHub, so it is kept out of search engines and never cached.
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
